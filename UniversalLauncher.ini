[Main]
AppName=Firefox Portátil
AppDir=App\Firefox
ExeName=firefox.exe
DataDir=DATA
RunAsAdmin=false
KillProcess=firefox.exe

[Directories]
Count=10
1=DATA
2=DATA\Registry
3=DATA\Mozilla
4=DATA\Mozilla\Firefox
5=DATA\Mozilla\Firefox\Profiles
6=DATA\Local
7=DATA\Roaming
8=DATA\Cache\Firefox
9=DATA\Temp
10=DATA\Downloads

[RegistryBackup]
Count=2
BackupFile=DATA\Registry\firefox_backup.reg
1=HKCU\Software\Mozilla
2=HKLM\Software\Mozilla

[RegistryCleanup]
Count=2
1=HKCU\Software\Mozilla
2=HKLM\Software\Mozilla

[RegistryKeys]
Count=4
1=HKCU\Software\Mozilla\Firefox|InstallDirectory|SZ|%AppDir%
2=HKCU\Software\Mozilla\Firefox|PathToExe|SZ|%AppDir%\firefox.exe
3=HKCU\Software\Mozilla\Firefox|DownloadDir|SZ|%DataDir%\Downloads
4=HKCU\Software\Mozilla\Firefox|StartMenuInternet|SZ|

[Environment]
Count=5
1=APPDATA=%DataDir%\Roaming
2=LOCALAPPDATA=%DataDir%\Local
3=USERPROFILE=%DataDir%
4=TEMP=%DataDir%\Temp
5=TMP=%DataDir%\Temp

[Launch]
Arguments=-profile "%DataDir%\Mozilla\Firefox\Profiles\default" -no-remote -allow-downgrade -no-maintenance-service -preferences -new-instance
Wait=true
